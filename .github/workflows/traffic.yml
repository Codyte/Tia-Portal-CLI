name: traffic

# A API de tráfego do GitHub só guarda 14 dias. Este workflow lê todo dia e dá append em
# docs/traffic/*.csv, que é o único lugar onde a série histórica vai existir.
#
# Precisa de um PAT em `secrets.TRAFFIC_TOKEN` com escopo `repo` (fine-grained: Administration
# read + Contents write): a API de tráfego exige push, e o GITHUB_TOKEN padrão do runner leva 403.
# Sem o secret, o job usa o GITHUB_TOKEN e falha alto — que é o certo, em vez de gravar CSV vazio.

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Conferir o token
        env:
          GH_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
        run: |
          test -n "$GH_TOKEN" && echo "TRAFFIC_TOKEN presente" || echo "TRAFFIC_TOKEN VAZIO"
          gh api repos/${{ github.repository }} --jq '.permissions' || true

      - name: Ler o tráfego
        env:
          GH_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
          TRAFFIC_REPO: ${{ github.repository }}
        run: python scripts/traffic-log.py

      - name: Commitar se mudou
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/traffic
          git diff --staged --quiet || git commit -m "chore: tráfego $(date -u +%F)"
          git push
