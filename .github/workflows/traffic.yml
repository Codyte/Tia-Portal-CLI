name: traffic

# A API de tráfego do GitHub só guarda 14 dias. Este workflow lê todo dia e dá append em
# docs/traffic/*.csv, que é o único lugar onde a série histórica vai existir.
#
# Precisa de um PAT em `secrets.TRAFFIC_TOKEN` (fine-grained: Administration read neste repo):
# a API de tráfego exige permissão de admin, e o GITHUB_TOKEN do runner leva 403 nela. O `git push`
# do último step é outro token — o do checkout — e é dele que vem o `permissions: contents: write`.
# Secret ausente ou vazio derruba o job, que é o certo: pior que job vermelho é CSV vazio calado.

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ler o tráfego
        env:
          GH_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
          TRAFFIC_REPO: ${{ github.repository }}
        run: python scripts/traffic-log.py

      - name: Commitar se mudou
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/traffic
          git diff --staged --quiet || git commit -m "chore: tráfego $(date -u +%F)"
          git push
